name: Fetch Awards

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install playwright ruamel.yaml

      - name: Install Firefox
        run: playwright install firefox --with-deps

      - name: Fetch Kometa event metadata
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/Kometa-Team/IMDb-Awards/main/event_ids.yml \
            -o kometa_event_ids.yml
          curl -fsSL \
            https://raw.githubusercontent.com/Kometa-Team/IMDb-Awards/main/event_validation.yml \
            -o kometa_event_validation.yml

      - name: Fetch events
        run: python fetch_events.py
        env:
          KOMETA_EVENT_IDS: kometa_event_ids.yml

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add events/
          git diff --staged --quiet || \
            (git commit -m "events: update $(date -u +'%Y-%m-%d')" && git push)
